[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pivotcheck"
dynamic = ["version"]
description = "Passive network discovery and pivot path validation for authorized security assessments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "PivotCheck contributors" }]
keywords = ["security", "pentest", "pivot", "network", "recon"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Debajyoti0-0/pivotcheck"
Issues = "https://github.com/Debajyoti0-0/pivotcheck/issues"
Changelog = "https://github.com/Debajyoti0-0/pivotcheck/blob/master/CHANGELOG.md"
"Security Policy" = "https://github.com/Debajyoti0-0/pivotcheck/blob/master/SECURITY.md"

[project.optional-dependencies]
socks = ["PySocks>=1.7.1"]
smb = ["smbprotocol>=1.15,<2"]
winrm = ["pywinrm>=0.5.0,<0.6"]
kerberos = [
    "gssapi>=1.10",
    "krb5>=0.10; platform_system != \"Windows\"",
]
encrypt = ["cryptography>=42.0"]
dev = ["ruff", "mypy", "cryptography>=42.0", "types-requests"]

[project.scripts]
pivotcheck = "pivotcheck.cli:main"

[tool.setuptools.packages.find]
include = ["pivotcheck*"]

[tool.setuptools.dynamic]
version = { attr = "pivotcheck.__version__" }

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = false

# Optional backend extras may or may not be installed in the analyzing
# environment; treat their imports as present-but-untyped in both cases
# so type-checking is environment-stable.
[[tool.mypy.overrides]]
module = [
  "smbprotocol.*",
  "spnego.*",
  "winrm.*",
  "requests_ntlm.*",
]
ignore_missing_imports = true
follow_imports = "skip"
