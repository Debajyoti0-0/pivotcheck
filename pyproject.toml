[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pivotcheck"
dynamic = ["version"]
description = "Passive network discovery and pivot path validation for authorized security assessments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "PivotCheck contributors" }]
keywords = ["security", "pentest", "pivot", "network", "recon"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Debajyoti0-0/pivotcheck"
Issues = "https://github.com/Debajyoti0-0/pivotcheck/issues"
Changelog = "https://github.com/Debajyoti0-0/pivotcheck/blob/master/CHANGELOG.md"
"Security Policy" = "https://github.com/Debajyoti0-0/pivotcheck/blob/master/SECURITY.md"

[project.optional-dependencies]
socks = ["PySocks>=1.7.1"]
smb = ["smbprotocol>=1.15,<2"]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "mypy"]

[project.scripts]
pivotcheck = "pivotcheck.cli:main"

[tool.setuptools.packages.find]
include = ["pivotcheck*"]

[tool.setuptools.dynamic]
version = { attr = "pivotcheck.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: requires live operating-system or network resources",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = false
