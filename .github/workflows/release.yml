name: Release

# Production release pipeline. Triggered only by pushing an intentional
# semantic-version tag.
#
# Pipeline: validate (tag/version integrity + full quality gates + build
# once + artifact audit) -> pypi-publish (Trusted Publishing OIDC, no
# rebuild).
#
# Every stage fails closed: a version/tag mismatch, a failing gate, a
# dirty artifact, or a failed publish stops the pipeline before the next
# stage. Validated artifacts are never rebuilt.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Verify tag format, exact-match, and package version integrity
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          TAG="$RELEASE_TAG"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match strict vX.Y.Z format"
            exit 1
          fi
          VERSION="${TAG#v}"
          ACTUAL="$(python -c 'from pivotcheck import __version__ as v; print(v)')"
          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "::error::Version mismatch: tag '$TAG' requires package version '$VERSION' but source declares '$ACTUAL'"
            exit 1
          fi
          TAG_COMMIT="$(git rev-parse "refs/tags/$TAG^{commit}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "::error::Tag '$TAG' does not point at the checked-out commit"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release integrity OK: tag=$TAG version=$VERSION commit=${HEAD_COMMIT:0:12}"

      - name: Install dev toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine

      - name: Ruff
        run: ruff check .

      - name: MyPy
        run: mypy pivotcheck

      - name: Build distributions (once)
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Audit distribution contents
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'EOF'
          import glob
          import os
          import sys
          import tarfile
          import zipfile
          from email.parser import Parser

          version = os.environ["VERSION"]
          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          if len(wheels) != 1 or len(sdists) != 1:
              sys.exit(f"::error::Expected exactly one wheel and one sdist, got {wheels} + {sdists}")
          wheel, sdist = wheels[0], sdists[0]
            if os.path.basename(wheel) != f"pivotcheck-{version}-py3-none-any.whl":
              sys.exit(f"::error::Unexpected wheel filename: {wheel}")
            if os.path.basename(sdist) != f"pivotcheck-{version}.tar.gz":
              sys.exit(f"::error::Unexpected sdist filename: {sdist}")

          forbidden = ("__pycache__", ".pytest_cache", ".mypy_cache", ".ruff_cache",
                   ".git/", ".github/", ".venv", "dist/", "build/", ".coverage",
                   ".pytest_tmp")
          with zipfile.ZipFile(wheel) as z:
              names = z.namelist()
              hits = [n for n in names if any(p in n for p in forbidden)]
              if hits:
                  sys.exit(f"::error::Wheel contains forbidden paths: {hits[:5]}")
              if f"pivotcheck-{version}.dist-info/licenses/LICENSE" not in names:
                  sys.exit("::error::Wheel is missing the LICENSE file")
              if not any(n.startswith("pivotcheck/") for n in names):
                  sys.exit("::error::Wheel does not contain the pivotcheck package")
                metadata = Parser().parsestr(
                  z.read(f"pivotcheck-{version}.dist-info/METADATA").decode()
                )
                if metadata["Name"] != "pivotcheck" or metadata["Version"] != version:
                  sys.exit("::error::Wheel metadata has the wrong name or version")
              print(f"wheel audit OK: {len(names)} members")

          allowed_top = {"LICENSE", "PKG-INFO", "README.md", "pyproject.toml",
                         "setup.cfg", "pivotcheck", "pivotcheck.egg-info"}
          with tarfile.open(sdist) as archive:
              names = archive.getnames()
              hits = [n for n in names if any(p in n for p in forbidden)]
              if hits:
                  sys.exit(f"::error::Sdist contains forbidden paths: {hits[:5]}")
                top = {
                  n.split("/", 1)[1].split("/", 1)[0]
                  for n in names
                  if "/" in n
                }
              unexpected = top - allowed_top
              if unexpected:
                  sys.exit(f"::error::Sdist contains unexpected entries: {sorted(unexpected)}")
              print(f"sdist audit OK: top-level = {sorted(top)}")

      - name: Install wheel and verify release interface
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --quiet dist/*.whl
          test "$(.release-venv/bin/pivotcheck --version)" = "pivotcheck ${{ steps.version.outputs.version }}"
          .release-venv/bin/pivotcheck --help > /dev/null
          .release-venv/bin/python -c "import pivotcheck; assert pivotcheck.__version__ == '${{ steps.version.outputs.version }}'"

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/pivotcheck
    permissions:
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: validated-dist
          path: dist/

      - name: Publish exact validated artifacts with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (2026-08-30)
        with:
          skip-existing: false
