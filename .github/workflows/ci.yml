name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest tests/ -q

      - name: Run integration tests
        run: python -m pytest -m integration -q

      - name: Run Ruff
        run: ruff check .

      - name: Run MyPy
        run: mypy pivotcheck

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  install-wheel:
    name: Install wheel from artifact
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: dist
          path: dist/

      - name: Install wheel in clean environment
        run: |
          python -m venv .venv-test
          .venv-test/bin/pip install --upgrade pip
          .venv-test/bin/pip install dist/*.whl

      - name: Verify CLI entry point
        run: |
          .venv-test/bin/pivotcheck --version
          .venv-test/bin/pivotcheck --help

      - name: Smoke test core commands
        run: |
          .venv-test/bin/pivotcheck next --json
          .venv-test/bin/pivotcheck gaps 10.50.0.0/16 --json
          .venv-test/bin/pivotcheck explain 10.50.0.0/16 --json
          .venv-test/bin/pivotcheck check 127.0.0.1 --port 80 --json
          .venv-test/bin/pivotcheck proxy-check --proxy socks5://127.0.0.1:1080 127.0.0.1 --port 80 --json
          .venv-test/bin/pivotcheck discover --json
          .venv-test/bin/pivotcheck map --json
          .venv-test/bin/pivotcheck baseline list --json

  install-sdist:
    name: Install sdist from artifact
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: dist
          path: dist/

      - name: Install sdist in clean environment
        run: |
          python -m venv .venv-test
          .venv-test/bin/pip install --upgrade pip
          .venv-test/bin/pip install dist/*.tar.gz

      - name: Verify CLI entry point
        run: |
          .venv-test/bin/pivotcheck --version
          .venv-test/bin/pivotcheck --help

      - name: Smoke test core commands
        run: |
          .venv-test/bin/pivotcheck next --json
          .venv-test/bin/pivotcheck gaps 10.50.0.0/16 --json
          .venv-test/bin/pivotcheck explain 10.50.0.0/16 --json
          .venv-test/bin/pivotcheck check 127.0.0.1 --port 80 --json

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true